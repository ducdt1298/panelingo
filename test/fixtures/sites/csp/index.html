<!doctype html>
<!--
  Served with: Content-Security-Policy: default-src 'none'; script-src 'self'; img-src <CDN origin>;
  style-src 'self'; font-src 'none'; require-trusted-types-for 'script'.
  Keep this page clean under that policy: no inline script or style attributes, no web fonts, images only from
  the CDN. __ctvFixture.violations must stay empty until an extension adds something.
-->
<html lang="{{LANG}}" data-page="{{PAGE}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    {{REFERRER_META}}
    <link rel="stylesheet" href="/_shared/fixture.css" />
    <script type="application/json" id="ctv-fixture-data">
      {{DATA}}
    </script>
    <script src="/_shared/fixture.js"></script>
  </head>
  <body>
    <header class="fixture-bar">
      <strong>Strict CSP reader</strong>
      <span>CSP default-src 'none', images from the CDN only, Trusted Types required</span>
      <a href="/">all fixtures</a>
    </header>
    <main class="paged" id="reader">{{IMAGES}}</main>
  </body>
</html>
