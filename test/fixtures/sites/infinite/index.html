<!doctype html>
<html lang="{{LANG}}" data-page="{{PAGE}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    {{REFERRER_META}}
    <link rel="stylesheet" href="/_shared/fixture.css" />
    <script type="application/json" id="ctv-fixture-data">
      {{DATA}}
    </script>
    <script src="/_shared/fixture.js"></script>
    <script src="/infinite/page.js" defer></script>
  </head>
  <body>
    <header class="fixture-bar">
      <strong>Infinite chapters</strong>
      <span>the next chapter is appended at the bottom and the URL follows with pushState</span>
      <a href="/">all fixtures</a>
    </header>
    <main class="reader" id="reader">
      {{IMAGES}}
      <div id="sentinel" class="sentinel" aria-hidden="true"></div>
    </main>
  </body>
</html>
