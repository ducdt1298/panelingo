<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Panelingo</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main id="app">
      <header class="popup-header">
        <h1><img class="logo" src="../assets/icons/icon-32.png" width="22" height="22" alt="" />Panelingo</h1>
        <button id="open-options" type="button" class="settings-button"></button>
      </header>
      <section id="site" class="card"></section>
      <section id="engine" class="engine-note" aria-live="polite" hidden></section>
      <footer id="footer">
        <button id="api" type="button" class="status-line" aria-live="polite"></button>
        <p id="uploads" class="uploads" hidden></p>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
