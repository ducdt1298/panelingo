# Python style for the fixture generator (optional tooling: `python -m ruff check/format tools/fixtures`).
line-length = 110
cache-dir = "../../.cache/ruff"  # gitignored
target-version = "py314"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[lint.isort]
known-first-party = ["fx_art", "fx_chapters", "fx_fonts", "fx_output", "fx_pages", "fx_probes", "fx_text", "fx_units", "fx_util", "make_fixtures"]
