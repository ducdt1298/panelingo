name: Feature request
description: Suggest an improvement or a new capability.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Please check [docs/ROADMAP.md](https://github.com/ducdt1298/panelingo/blob/main/docs/ROADMAP.md)
        and existing issues first. Requests for a new UI language or target language are welcome too.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the extension do? Mock-ups or examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection / erasing
        - Translation / prompts / series memory
        - Lettering and fonts
        - Site support (discovery, image loading)
        - Providers and models
        - UI (popup, options, side panel)
        - Localization (UI or target languages)
        - Privacy and security
        - Developer experience
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself (see CONTRIBUTING.md).
