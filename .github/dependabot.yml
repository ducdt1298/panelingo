version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    # onnxruntime-web ships the WASM binary and must stay in step with the detector canary; review it by hand.
    ignore:
      - dependency-name: onnxruntime-web
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
