name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new queries run against unchanged code too.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (JavaScript / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # The TypeScript sources are analyzed directly; generated builds and fixtures are not project code.
          config: |
            paths-ignore:
              - dist
              - test/fixtures
              - vendor

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
